# Optional v1.7 slicer overlay for a verified, digest-pinned combined worker.
# Four LONG-RUNNING services: makervault, slicer-worker, postgres, redis.
# The engine-store init service runs once and exits; it is not a fifth daemon.
# Use with compose.yaml. Never combine with compose.slicer.staging.yaml.
# Engine binaries, images and their exact checksums must be independently verified
# before enabling execution; see docs/guide/3d-printing/slicer.md.
services:
  makervault:
    environment:
      MAKERVAULT_SLICER_PREVIEW_ENABLED: "1"
      MAKERVAULT_SLICER_HOST_UPDATER_ENABLED: "0"
      MAKERVAULT_SLICER_INSTALLER_URL: http://slicer-worker:8091
      MAKERVAULT_SLICER_INSTALLER_TOKEN: "${MAKERVAULT_SLICER_INSTALLER_TOKEN:?Set a unique installer token}"
      MAKERVAULT_SLICER_WORKER_URL: http://slicer-worker:8088
      MAKERVAULT_SLICER_WORKER_TOKEN: "${MAKERVAULT_SLICER_WORKER_TOKEN:?Set a unique worker token}"
      MAKERVAULT_SLICER_EXECUTION_ENABLED: "${MAKERVAULT_SLICER_EXECUTION_ENABLED:-0}"
      MAKERVAULT_SLICER_WORKER_IMAGE: "${MAKERVAULT_SLICER_WORKER_IMAGE:?Pin a reviewed combined worker image}"
      MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST: "${MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST:?Set the approved image digest}"
      MAKERVAULT_SLICER_ENGINES_JSON: "${MAKERVAULT_SLICER_ENGINES_JSON:?Set approved native binary hashes}"
    networks:
      - makervault_backend
      - makervault_slicer

  slicer-engine-store-init:
    # One-off permissions preparation, not a long-running container.
    image: busybox:1.37.0
    command: ["sh", "-ec", "chown -R 10002:10002 /engine-store; find /engine-store -type d -exec chmod 0755 {} +; find /engine-store -type f -exec chmod go-w,a+rX {} +"]
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    network_mode: "none"
    volumes:
      - makervault_slicer_engines:/engine-store:rw

  slicer-worker:
    # DNS name is slicer-worker; the single running container has a friendly name.
    container_name: makervault-slicer
    image: "${MAKERVAULT_SLICER_WORKER_IMAGE:?Pin a reviewed combined worker image}"
    command: ["python3", "-m", "slicer_worker.combined_service"]
    restart: unless-stopped
    depends_on:
      slicer-engine-store-init:
        condition: service_completed_successfully
    # Entry-point drops worker and installer processes to separate UIDs.
    user: "0:0"
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 144
    mem_limit: 4g
    cpus: 3
    tmpfs:
      - /tmp:rw,nosuid,size=1g,mode=1777
    volumes:
      - makervault_slicer_engines:/opt/engine-store:rw
    environment:
      SLICER_WORKER_ENABLED: "1"
      SLICER_WORKER_TOKEN: "${MAKERVAULT_SLICER_WORKER_TOKEN:?Set a unique worker token}"
      SLICER_INSTALLER_TOKEN: "${MAKERVAULT_SLICER_INSTALLER_TOKEN:?Set a unique installer token}"
      SLICER_ENGINES_JSON: "${SLICER_ENGINES_JSON:?Set the verified engine registry}"
    networks:
      - makervault_slicer
      - makervault_installer_egress
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,socket,json,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=2)); s=socket.create_connection(('127.0.0.1',8091),timeout=2); s.close(); sys.exit(0 if d.get('ready') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # No published worker/installer ports, Docker socket, printer, database or media mounts.

networks:
  makervault_slicer:
    internal: true
  makervault_installer_egress:
    driver: bridge

volumes:
  makervault_slicer_engines:
    # Never delete with 'docker compose down -v'.
