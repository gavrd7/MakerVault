# OPTIONAL production-oriented slicer worker overlay; NOT loaded by default.
# Only use after the reviewed worker image is published and its digest approved.
# Supply variables through a restricted .env or --env-file (never commit secrets).
# docker compose -f compose.yaml -f compose.slicer.yaml --profile slicer up -d
# Never combine with compose.slicer.staging.yaml.
services:
  makervault:
    environment:
      MAKERVAULT_SLICER_PREVIEW_ENABLED: "1"
      MAKERVAULT_SLICER_HOST_UPDATER_ENABLED: ${MAKERVAULT_SLICER_HOST_UPDATER_ENABLED:-0}
      MAKERVAULT_SLICER_INSTALLER_URL: http://slicer-engine-installer:8091
      MAKERVAULT_SLICER_INSTALLER_TOKEN: ${MAKERVAULT_SLICER_INSTALLER_TOKEN:-disabled}
      MAKERVAULT_SLICER_WORKER_URL: http://slicer-worker:8088
      MAKERVAULT_SLICER_WORKER_TOKEN: ${MAKERVAULT_SLICER_WORKER_TOKEN:?Configure a unique worker token}
      MAKERVAULT_SLICER_EXECUTION_ENABLED: ${MAKERVAULT_SLICER_EXECUTION_ENABLED:-0}
      MAKERVAULT_SLICER_WORKER_IMAGE: ${MAKERVAULT_SLICER_WORKER_IMAGE:?Set a reviewed GHCR image@sha256: digest}
      MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST: ${MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST:?Set the exact registry SHA-256 digest}
      MAKERVAULT_SLICER_ENGINES_JSON: ${MAKERVAULT_SLICER_ENGINES_JSON:?Approve each native engine binary SHA-256}
    networks:
      - makervault_backend
      - makervault_slicer

  slicer-worker:
    profiles: ["slicer"]
    image: ${MAKERVAULT_SLICER_WORKER_IMAGE:?Pin the reviewed GHCR image@sha256: digest}
    restart: unless-stopped
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 3g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,size=1g,mode=1777
    # One persistent, host-managed engine store for all future slicer engines.
    # Read-only to the worker; the future host updater alone may install to it.
    volumes:
      - makervault_slicer_engines:/opt/engine-store:ro
    environment:
      SLICER_WORKER_ENABLED: "1"
      SLICER_WORKER_TOKEN: ${MAKERVAULT_SLICER_WORKER_TOKEN:?Configure a unique worker token}
      SLICER_ENGINES_JSON: ${SLICER_ENGINES_JSON:?Provide exact approved binary paths and checksums}
    networks:
      - makervault_slicer
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,json,sys; s=json.load(urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=2)); sys.exit(0 if s.get('ready') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Deliberately no host ports, Docker socket, application media or database mounts.

  slicer-engine-store-init:
    profiles: ["engine-installer"]
    image: busybox:1.37.0
    command: ["sh", "-c", "chown -R 10001:10001 /engine-store"]
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    network_mode: "none"
    volumes:
      - makervault_slicer_engines:/engine-store:rw

  slicer-engine-installer:
    profiles: ["engine-installer"]
    image: makervault-engine-installer:local
    build:
      context: .
      dockerfile: slicer_worker/Dockerfile.generic
    command: ["python3", "-m", "slicer_worker.engine_installer_service"]
    restart: unless-stopped
    depends_on:
      slicer-engine-store-init:
        condition: service_completed_successfully
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 48
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    volumes:
      - makervault_slicer_engines:/opt/engine-store:rw
    environment:
      SLICER_INSTALLER_TOKEN: ${MAKERVAULT_SLICER_INSTALLER_TOKEN:-disabled}
    networks:
      - makervault_slicer
      - makervault_installer_egress
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8091)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # No published ports, Docker socket, database, printer or media access.

networks:
  makervault_slicer:
    internal: true
  makervault_installer_egress:
    driver: bridge

volumes:
  makervault_slicer_engines:
    # Never remove with 'docker compose down -v': this holds engine versions.
