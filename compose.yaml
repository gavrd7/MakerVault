name: makervault

services:
  makervault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makervault
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/London}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/London}
      DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE:-en-gb}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-0022}
      FIX_PERMISSIONS: ${FIX_PERMISSIONS:-true}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      MAKERVAULT_BACKUP_AGENT_URL: http://backup-agent:9784
      MAKERVAULT_BACKUP_ROOT: /app/backups
    ports:
      - "${MAKERVAULT_BIND_ADDRESS:-0.0.0.0}:${MAKERVAULT_PORT:-8765}:8000"
    volumes:
      - ${MEDIA_STORAGE:-makervault_media}:/app/media
      - ${KEY_STORAGE:-makervault_keys}:/app/keys
      - ${BACKUP_STORAGE:-makervault_backups}:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - makervault_backend
    healthcheck:
      test: ["CMD", "python", "/app/backend/manage.py", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  postgres:
    image: postgres:18.6
    container_name: makervault-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      POSTGRES_DB: ${POSTGRES_DB:-makervault}
      POSTGRES_USER: ${POSTGRES_USER:-makervault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ expects the persistent mount at /var/lib/postgresql.
      - ${POSTGRES_STORAGE:-makervault_postgres}:/var/lib/postgresql
    networks:
      - makervault_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makervault} -d ${POSTGRES_DB:-makervault}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup-agent:
    build:
      context: .
      dockerfile: docker/backup-agent.Dockerfile
    container_name: makervault-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/London}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-makervault}
      POSTGRES_USER: ${POSTGRES_USER:-makervault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MAKERVAULT_BACKUP_TOKEN: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      MAKERVAULT_VERSION: ${MAKERVAULT_VERSION:-}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${MEDIA_STORAGE:-makervault_media}:/source/media:ro
      - ${KEY_STORAGE:-makervault_keys}:/source/keys:ro
      - ${BACKUP_STORAGE:-makervault_backups}:/backups
      - ./:/source/config:ro
    depends_on:
      makervault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - makervault_backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9784/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Restore is deliberately a separate, normally inactive profile. The running
  # backup service has read-only media/key mounts; only the host-side guarded
  # restore helper invokes this service with writable recovery mounts.
  restore-agent:
    profiles: ["restore"]
    build:
      context: .
      dockerfile: docker/backup-agent.Dockerfile
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/London}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-makervault}
      POSTGRES_USER: ${POSTGRES_USER:-makervault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    user: "0:0"
    volumes:
      - ${MEDIA_STORAGE:-makervault_media}:/source/media
      - ${KEY_STORAGE:-makervault_keys}:/source/keys
      - ${BACKUP_STORAGE:-makervault_backups}:/backups
      - ./:/source/config:ro
    networks:
      - makervault_backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:8.10.1-alpine
    container_name: makervault-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ${REDIS_STORAGE:-makervault_redis}:/data
    networks:
      - makervault_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  makervault_backend:
    driver: bridge

# These named volumes are used by default. If a *_STORAGE variable is an absolute
# path instead, Compose treats it as a bind mount and these declarations remain harmless.
volumes:
  makervault_media:
  makervault_keys:
  makervault_postgres:
  makervault_redis:
  makervault_backups:
