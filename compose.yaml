name: makervault

services:
  makervault:
    image: ${MAKERVAULT_IMAGE:-ghcr.io/gavrd7/makervault:latest}
    container_name: makervault
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/London}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/London}
      DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE:-en-gb}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-0022}
      FIX_PERMISSIONS: ${FIX_PERMISSIONS:-true}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      MAKERVAULT_BACKUP_ROOT: /app/backups
      # Optional workbench preview without a slicer worker; never enables execution.
      MAKERVAULT_SLICER_PREVIEW_ENABLED: ${MAKERVAULT_SLICER_PREVIEW_ENABLED:-0}
      # Development-only: the worker below is NOT approved for production use.
      # Uncomment these together only after you have built and verified a digest-pinned
      # multi-engine worker image and its exact Orca/Creality binary checksums.
      # MAKERVAULT_SLICER_EXECUTION_ENABLED: ${MAKERVAULT_SLICER_EXECUTION_ENABLED:-0}
      # MAKERVAULT_SLICER_WORKER_URL: http://slicer-worker:8088
      # MAKERVAULT_SLICER_WORKER_TOKEN: ${MAKERVAULT_SLICER_WORKER_TOKEN:?Set a long unique token}
      # MAKERVAULT_SLICER_WORKER_IMAGE: ${MAKERVAULT_SLICER_WORKER_IMAGE:?Pin a verified image by digest}
      # MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST: ${MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST:?Set exact sha256 image digest}
      # MAKERVAULT_SLICER_ENGINES_JSON: ${MAKERVAULT_SLICER_ENGINES_JSON:?Approve exact installed engine versions and binary SHA256s}
      MAKERVAULT_HTTPS_ENABLED: ${MAKERVAULT_HTTPS_ENABLED:-auto}
      MAKERVAULT_HTTPS_SELF_SIGNED: ${MAKERVAULT_HTTPS_SELF_SIGNED:-false}
      MAKERVAULT_HTTPS_SELF_SIGNED_NAMES: ${MAKERVAULT_HTTPS_SELF_SIGNED_NAMES:-}
      MAKERVAULT_TLS_CERT_FILE: ${MAKERVAULT_TLS_CERT_FILE:-/app/keys/tls/cert.pem}
      MAKERVAULT_TLS_KEY_FILE: ${MAKERVAULT_TLS_KEY_FILE:-/app/keys/tls/key.pem}
      HTTPS_WEB_CONCURRENCY: ${HTTPS_WEB_CONCURRENCY:-2}
      HTTPS_WEB_THREADS: ${HTTPS_WEB_THREADS:-4}
      HTTPS_KEEPALIVE_SECONDS: ${HTTPS_KEEPALIVE_SECONDS:-15}
    ports:
      - "${MAKERVAULT_BIND_ADDRESS:-0.0.0.0}:${MAKERVAULT_PORT:-8765}:8000"
      - "${MAKERVAULT_HTTPS_BIND_ADDRESS:-0.0.0.0}:${MAKERVAULT_HTTPS_PORT:-8443}:8443"
    volumes:
      - ${MEDIA_STORAGE:-makervault_media}:/app/media
      - ${KEY_STORAGE:-makervault_keys}:/app/keys
      - ${BACKUP_STORAGE:-makervault_backups}:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - makervault_backend
      # - makervault_slicer  # only if the optional slicer service is enabled
    healthcheck:
      test: ["CMD", "python", "/app/backend/manage.py", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # OPTIONAL SLICER WORKER — NOT INSTALLED BY DEFAULT.
  #
  # Staging: scripts/install_slicer_staging.py prepare-orca / enable
  # Then use scripts/install_slicer_staging.py update for app rebuilds:
  # this includes compose.slicer.staging.yaml + .slicer-staging.env automatically.
  # Production: inspect compose.slicer.yaml and supply an independently approved
  # immutable worker image and engine identity. The commented service below is
  # architectural reference only; do not enable it alongside either overlay.
  # No Docker socket, host media mounts or extra privileges are required.
  # slicer-worker:
  #   image: ${MAKERVAULT_SLICER_WORKER_IMAGE:?Set an approved image@sha256:...}
  #   restart: unless-stopped
  #   user: "10001:10001"
  #   read_only: true
  #   init: true
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   pids_limit: 96
  #   mem_limit: 3g
  #   cpus: 2.0
  #   tmpfs:
  #     - /tmp:rw,nosuid,size=1g
  #   environment:
  #     SLICER_WORKER_ENABLED: "1"
  #     SLICER_WORKER_TOKEN: ${MAKERVAULT_SLICER_WORKER_TOKEN:?Set a long unique token}
  #     SLICER_ENGINES_JSON: ${SLICER_ENGINES_JSON:?Declare verified binaries, versions and SHA256s}
  #   networks:
  #     - makervault_slicer
  #   # No published ports, Docker socket, database credentials or host bind mounts.

  postgres:
    image: postgres:18.6
    container_name: makervault-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      POSTGRES_DB: ${POSTGRES_DB:-makervault}
      POSTGRES_USER: ${POSTGRES_USER:-makervault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ expects the persistent mount at /var/lib/postgresql.
      - ${POSTGRES_STORAGE:-makervault_postgres}:/var/lib/postgresql
    networks:
      - makervault_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makervault} -d ${POSTGRES_DB:-makervault}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    container_name: makervault-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ${REDIS_STORAGE:-makervault_redis}:/data
    networks:
      - makervault_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  makervault_backend:
    driver: bridge
  # Dedicated worker link, no external access. Enable with the optional service.
  # makervault_slicer:
  #   internal: true

# These named volumes are used by default. If a *_STORAGE variable is an absolute
# path instead, Compose treats it as a bind mount and these declarations remain harmless.
volumes:
  makervault_media:
  makervault_keys:
  makervault_postgres:
  makervault_redis:
  makervault_backups:
