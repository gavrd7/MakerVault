name: Creality Print native modifier diagnostic

on:
  pull_request:
    paths:
      - "scripts/build_creality_modifier_profiles.py"
      - "scripts/build_creality_modifier_projects.py"
      - "scripts/diagnose_creality_modifier_import.py"
      - "scripts/build_native_modifier_fixture.py"
      - "scripts/build_native_composite_fixture.py"
      - "scripts/build_native_composite_creality_projects.py"
      - "slicer_worker/composite_acceptance_probe.py"
      - "slicer_worker/modifier_acceptance_probe.py"
      - "slicer_worker/modifier_3mf_validation.py"
      - "backend/core/slicer_modifier_3mf.py"
      - "backend/core/slicer_creality_modifier_project.py"
      - "slicer_worker/creality_modifier_validation.py"
      - "scripts/probe_creality_modifier_security.py"
      - ".github/workflows/native-modifier-creality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-creality-regional-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact-version Creality native profiles and bounded modifier projects
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/diagnose_creality_modifier_import.py scripts/build_creality_modifier_projects.py backend/core/slicer_creality_modifier_project.py slicer_worker/creality_modifier_validation.py scripts/probe_creality_modifier_security.py
          python3 -m pip install --disable-pip-version-check --no-input --target /tmp/creality-modifier-pydeps "defusedxml>=0.7.1,<0.8"
          # Later isolated CLI steps intentionally set HOME=/tmp. A fixed
          # non-user dependency directory keeps Python fixture imports stable.
          export PYTHONPATH="/tmp/creality-modifier-pydeps:${PYTHONPATH:-}"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          python3 -c "from defusedxml import ElementTree; print('Fixture XML parser available')"
          python3 scripts/build_creality_modifier_profiles.py --output /tmp/creality-pinned-profiles
          python3 scripts/build_native_modifier_fixture.py --output-dir /tmp/creality-native-modifiers
          for kind in printer filament process; do
            cp "/tmp/creality-pinned-profiles/$kind.json" "/tmp/creality-native-modifiers/$kind.json"
          done
      - name: Download SHA-256 pinned official Creality Print 7.3.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 15 --max-time 600 \
            "https://github.com/CrealityOfficial/CrealityPrint/releases/download/v7.3.1/CrealityPrint-V7.3.1.6378-x86_64-Release.AppImage" \
            --output /tmp/crealityprint-7.3.1.AppImage
          echo "f8c8dbf18a6b0d5878961b24490fc20958eefe2f03f6a89f524cb9b21e55a107  /tmp/crealityprint-7.3.1.AppImage" | sha256sum --check
          chmod 755 /tmp/crealityprint-7.3.1.AppImage
      - name: Extract pinned AppImage without FUSE or printer/network access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/creality-modifier-app
          cd /tmp/creality-modifier-app
          timeout 180s /tmp/crealityprint-7.3.1.AppImage --appimage-extract >/dev/null
          test -e squashfs-root/AppRun
          readlink -f squashfs-root/AppRun > /tmp/creality-modifier-binary
          test -x "$(cat /tmp/creality-modifier-binary)"
      - name: Install pinned Creality AppImage system runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libfuse2t64 libglib2.0-0t64 libgl1 libglu1-mesa libegl1 libopengl0 \
            libdbus-1-3 libnss3 libfontconfig1 libfreetype6 \
            libx11-6 libxext6 libxrender1 libxi6 libxrandr2 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libasound2t64 libgtk-3-0t64 libwebkit2gtk-4.1-0 \
            libjavascriptcoregtk-4.1-0 libgstreamer-plugins-base1.0-0 \
            libsm6 libice6 libxss1 libxtst6 libxcb-xinerama0 libxcb-cursor0
      - name: Inspect only official extracted Creality runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/creality-modifier-app
          file squashfs-root/AppRun
          echo "Resolved launcher: $(readlink -f squashfs-root/AppRun)"
          echo "Missing system runtime libraries (diagnostic):"
          ldd "$(cat /tmp/creality-modifier-binary)" 2>/dev/null | grep 'not found' || true
          LD_LIBRARY_PATH="$PWD/squashfs-root/bin:$PWD/squashfs-root/usr/lib" \
            ldd squashfs-root/bin/CrealityPrint 2>/dev/null | grep 'not found' || true
          echo "Official extracted bundled library paths:"
          find squashfs-root -maxdepth 3 -type d -name lib -print | head -20
          find squashfs-root -maxdepth 3 -type d -name lib64 -print | head -20
          echo "Official public launcher initialization (first 60 lines):"
          sed -n '1,60p' squashfs-root/AppRun | cut -c 1-180
      - name: Run exact Creality CLI regional-effect and project-loader probe
        id: native_modifier
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          LIBGL_ALWAYS_SOFTWARE: "1"
          HOME: /tmp
        run: |
          set -euo pipefail
          timeout 900s python3 -m slicer_worker.modifier_acceptance_probe \
            --engine crealityprint \
            --fixtures /tmp/creality-native-modifiers \
            --binary "$(cat /tmp/creality-modifier-binary)"
      - name: Build native Creality 7.3.1 self-contained modifier projects
        id: native_packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_creality_modifier_projects.py \
            --fixtures /tmp/creality-native-modifiers
      - name: Require native Creality modifier archive tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/probe_creality_modifier_security.py \
            --project /tmp/creality-native-modifiers/native-modified.3mf
      - name: Probe Creality's actual native project loader and regional G-code
        id: native_project
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s python3 -m slicer_worker.modifier_acceptance_probe \
            --engine crealityprint --creality-native-project --production-validator \
            --fixtures /tmp/creality-native-modifiers \
            --binary "$(cat /tmp/creality-modifier-binary)"
      - name: Verify all five additional Creality modifier primitives with real G-code
        id: creality_shape_matrix
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          HOME: /tmp
        run: |
          set -euo pipefail
          for shape in cylinder sphere cone disc torus; do
            echo "Testing genuine Creality 7.3.1 modifier geometry: $shape"
            target="/tmp/creality-native-$shape"
            python3 scripts/build_native_modifier_fixture.py --output-dir "$target" --shape "$shape"
            for kind in printer process filament; do
              cp "/tmp/creality-pinned-profiles/$kind.json" "$target/$kind.json"
            done
            python3 scripts/build_creality_modifier_projects.py --fixtures "$target"
            timeout 240s python3 -m slicer_worker.modifier_acceptance_probe \
              --engine crealityprint --creality-native-project --production-validator \
              --fixtures "$target" \
              --binary "$(cat /tmp/creality-modifier-binary)"
          done
      - name: Require native Creality independent XYZ modifier transformation
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          HOME: /tmp
        run: |
          set -euo pipefail
          root=/tmp/creality-modifier-world-pose
          python3 scripts/build_native_modifier_fixture.py --output-dir "$root" --world-pose
          for kind in printer process filament; do
            cp "/tmp/creality-pinned-profiles/$kind.json" "$root/$kind.json"
          done
          python3 scripts/build_creality_modifier_projects.py --fixtures "$root"
          timeout 240s python3 -m slicer_worker.modifier_acceptance_probe \
            --engine crealityprint --creality-native-project --production-validator \
            --fixtures "$root" --binary "$(cat /tmp/creality-modifier-binary)"
      - name: Compare genuine CLI import of baseline and modifier 3MF variants
        id: import_matrix
        if: steps.native_packaging.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          HOME: /tmp
        run: |
          set -euo pipefail
          # Compare model/part/assembly XML against a genuine, pinned
          # upstream Creality 3MF test fixture, not an invented template.
          reference=()
          if curl --fail --location --silent --show-error --retry 2 \
            --max-time 50 \
            "https://raw.githubusercontent.com/CrealityOfficial/CrealityPrint/v7.3.1/tests/engine_test/baseline/simple-box.3mf" \
            --output /tmp/creality-genuine-simple-box.3mf; then
            if python3 -c 'import sys,zipfile;sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)' \
              /tmp/creality-genuine-simple-box.3mf; then
              reference=(--reference /tmp/creality-genuine-simple-box.3mf)
            else
              echo "::warning::Upstream native 3MF is not a ZIP fixture (possibly Git LFS)."
            fi
          else
            echo "::warning::Upstream native 3MF reference unavailable; local import matrix still runs."
          fi
          timeout 1300s python3 scripts/diagnose_creality_modifier_import.py \
            --fixtures /tmp/creality-native-modifiers \
            --binary "$(cat /tmp/creality-modifier-binary)" \
            "${reference[@]}"
      - name: Diagnose native Creality 3MF rejection without retaining profiles
        if: steps.native_packaging.outcome == 'success' && steps.native_project.outcome == 'failure'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/creality-native-diagnostic-output
          set +e
          timeout 90s "$(cat /tmp/creality-modifier-binary)" \
            --cli --slice 0 --outputdir /tmp/creality-native-diagnostic-output \
            --need-gcode-file /tmp/creality-native-modifiers/native-modified.3mf \
            >/tmp/creality-native-diagnostic.log 2>&1
          code=$?
          set -e
          echo "Exact pinned Creality native-project CLI exit: $code"
          # Only static public fixture errors, never upload any private
          # project or user data. Capped diagnostic keywords and width.
          grep -Ei 'load|error|invalid|fail|missing|config|project|model|plate|part|version|setting' \
            /tmp/creality-native-diagnostic.log | tail -50 | cut -c 1-180 || true
      - name: Require native Creality two-model modifier and negative volume G-code proof
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          LIBGL_ALWAYS_SOFTWARE: "1"
          HOME: /tmp
        run: |
          set -euo pipefail
          root=/tmp/native-composite-creality
          python3 scripts/build_native_composite_fixture.py --output-dir "$root"
          for kind in printer process filament; do
            cp "/tmp/creality-pinned-profiles/$kind.json" "$root/$kind.json"
          done
          python3 scripts/build_native_composite_creality_projects.py --fixtures "$root"
          timeout 900s python3 -m slicer_worker.composite_acceptance_probe \
            --engine crealityprint --creality-native-project \
            --fixtures "$root" --binary "$(cat /tmp/creality-modifier-binary)"
      - name: Record Creality parser and regional effects result
        if: always()
        run: |
          echo "### Native Creality Print 7.3.1 parameter modifier probe" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generic non-native 3MF (expected unsupported): ${{ steps.native_modifier.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Self-contained Creality project packager: ${{ steps.native_packaging.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline vs modifier 3MF CLI import matrix: ${{ steps.import_matrix.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native project-loader regional G-code proof: ${{ steps.native_project.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Five additional Creality primitive regional G-code tests: ${{ steps.creality_shape_matrix.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native regional-effect and five additional shapes are REQUIRED gates; generic non-native import remains diagnostic-only." >> "$GITHUB_STEP_SUMMARY"
          echo "- Fixture-only proof: production modifier admission is still explicitly disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "- Official AppImage SHA-256 is verified. No printer connection or application data changes." >> "$GITHUB_STEP_SUMMARY"
