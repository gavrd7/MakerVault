name: Bambu Studio pinned Linux AppImage candidate

on:
  pull_request:
    paths:
      - 'scripts/prepare_bambu_staging.py'
      - 'scripts/prepare_bambu_native_fixtures.py'
      - 'slicer_worker/bambu_runner.py'
      - 'slicer_worker/stage_engines.py'
      - 'slicer_worker/probe.py'
      - 'slicer_worker/tests/test_bambu*.py'
      - 'slicer_worker/Dockerfile.bundle'
      - '.github/workflows/bambu-real-binary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned-bambu-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Bambu candidate unit tests
        run: python3 -m unittest discover -s slicer_worker/tests -p 'test_bambu*.py' -v
      - name: Download and verify official Bambu Studio AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_bambu_staging.py
      - name: Verify the exact pinned executable
        run: |
          echo '668dabb1be53c758189ed6bc89935285dea5e0af46216546b1bafd6882e9aff0  slicer-engine-assets/bambustudio.AppImage' | sha256sum --check --status
          test -f slicer-engine-assets/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('slicer-engine-assets/manifest.json').read_text())
          assert doc.get('fixture_approved') is False
          entry = doc['engines']['bambustudio']
          assert entry['version'] == '02.09.01.70'
          assert entry['binary_sha256'] == '668dabb1be53c758189ed6bc89935285dea5e0af46216546b1bafd6882e9aff0'
          PY
      - name: Extract native AppRun and resources without enabling worker
        run: |
          mkdir -p /tmp/bambu-appimage-acceptance
          cd /tmp/bambu-appimage-acceptance
          "$GITHUB_WORKSPACE/slicer-engine-assets/bambustudio.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -d squashfs-root/usr
          echo 'Official pinned Bambu Studio AppImage verified and extracted; no engine was enabled or print started.'

      - name: Launch actual pinned Bambu CLI in headless offline mode
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/bambu-appimage-acceptance
          mkdir -p /tmp/bambu-cli-home
          # Prove the extracted entrypoint starts as a CLI, not merely that
          # the AppImage unpacks. No profile, model or printer is supplied.
          # Keep this offline and bounded, even if upstream regresses into GUI startup.
          timeout 45s env -u DISPLAY -u WAYLAND_DISPLAY \
            HOME=/tmp/bambu-cli-home QT_QPA_PLATFORM=offscreen \
            SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            ./squashfs-root/AppRun --help > /tmp/bambu-help.log 2>&1 || {
              status=$?
              echo "Pinned Bambu Studio CLI startup failed (exit ${status})."
              tail -60 /tmp/bambu-help.log
              exit "$status"
            }
          grep -Eiq -- '--(slice|load-settings|load-filaments|export-3mf)' /tmp/bambu-help.log
          echo 'Pinned Bambu Studio headless command-line startup verified.'

      - name: Resolve exact-version official X1C native profiles from extracted bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_bambu_native_fixtures.py \
            --appdir /tmp/bambu-appimage-acceptance/squashfs-root \
            --output /tmp/bambu-verified-profiles
          python3 - <<'PY'
          import json
          from pathlib import Path
          for kind in ('printer', 'process', 'filament'):
              path = Path('/tmp/bambu-verified-profiles') / (kind + '.json')
              value = json.loads(path.read_text())
              assert 'inherits' not in value and 'include' not in value
              assert value['type'] == ('machine' if kind == 'printer' else kind)
          print('Official native profile ancestry fully resolved.')
          PY
      - name: Attempt genuine pinned Bambu CLI single-material STL slice
        shell: bash
        run: |
          set -euo pipefail
          # CI runner is ephemeral and has no printer credentials or MakerVault
          # server connection. This is still only a preliminary native CLI
          # proof; isolated staging acceptance remains a separate gate.
          timeout 240s python3 -m slicer_worker.probe \
            --engine bambustudio --version 02.09.01.70 \
            --binary /tmp/bambu-appimage-acceptance/squashfs-root/AppRun \
            --printer /tmp/bambu-verified-profiles/printer.json \
            --process /tmp/bambu-verified-profiles/process.json \
            --filament /tmp/bambu-verified-profiles/filament.json \
            --timeout 180
