name: Publish reviewed PrusaSlicer 2.9.7 runtime (manual)

# This is deliberately independent of MakerVault's v* application releases.
# It NEVER runs automatically on a branch push, PR merge or tagged release.
on:
  # A single explicitly tagged branch commit can promote the fully vetted
  # artifact before main is merged. No ordinary PR push publishes anything.
  push:
    branches: [feature/slicer-prusa-engine]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH-PRUSA-2.9.7 to promote the fully verified, exact pinned artifact'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: reviewed-prusa-2.9.7-runtime
  cancel-in-progress: false

jobs:
  publish-reviewed-prusa:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH-PRUSA-2.9.7') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[prusa-runtime-publish]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed MakerVault Prusa admission code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download exact successful source-pinned candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/reviewed-prusa
          # This exact Actions run passed genuine FFF native cube G-code
          # acceptance, 3,737 positive extrusion moves, on 25 Nov 2026.
          # Github Actions will expire this intermediate artifact after 7d.
          gh run download 45509961312 --repo "$GITHUB_REPOSITORY" \
            --name prusa-2.9.7-headless-linux-amd64-candidate \
            --dir /tmp/reviewed-prusa
          archive=/tmp/reviewed-prusa/prusa-2.9.7-headless-linux-amd64.tar.gz
          test -f "$archive"
          echo '963eb81fd972d50c5f8fe54c3adb6dce2eab39c9ab223534b917eae76973d913  /tmp/reviewed-prusa/prusa-2.9.7-headless-linux-amd64.tar.gz' | sha256sum --check --status

      - name: Verify every file, ELF architecture, source identity and actual G-code
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng16-16
          mkdir -p /tmp/reviewed-prusa/stage
          python3 - <<'PY'
          from pathlib import Path
          from slicer_worker.prusa_runtime_install import (
              unpack_reviewed_prusa, sha256, BINARY_SHA256)
          root = Path('/tmp/reviewed-prusa')
          binary = unpack_reviewed_prusa(
              root / 'prusa-2.9.7-headless-linux-amd64.tar.gz',
              root / 'stage')
          assert sha256(binary) == BINARY_SHA256
          print('Immutable Prusa ELF and 1179-file bundle identity passed.')
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python3 scripts/prusa_real_binary_smoke.py \
            --binary /tmp/reviewed-prusa/stage/bin/prusa-slicer \
            --vendor /tmp/reviewed-prusa/stage/resources/profiles/PrusaResearch.ini

      - name: Publish immutable Prusa-only asset (no app or engine deployment)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='prusa-runtime-v2.9.7-450d70d'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Reviewed Prusa runtime tag already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$tag" \
            /tmp/reviewed-prusa/prusa-2.9.7-headless-linux-amd64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Reviewed PrusaSlicer 2.9.7 Linux AMD64 runtime" \
            --notes "Opt-in, standalone MakerVault PrusaSlicer runtime package built from pinned upstream source commit 450d70dd81c9b8990bc6bc8e690e31f82ddceb11. Review-only archive passed exact SHA-256, per-file integrity, ELF and native cube G-code acceptance. Not a MakerVault application release. No server installation or automatic activation occurs."
          # GitHub exposes the release asset's content digest; the isolated
          # installer admits it only when that digest and exact size match.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url \
            --jq .url >> "$GITHUB_STEP_SUMMARY"

  restore-app-latest:
    # An out-of-band runtime package must never displace the latest actual
    # MakerVault app release. This is metadata only, no binaries are changed.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[prusa-fix-latest]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Keep standalone Prusa runtime separate from MakerVault release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit prusa-runtime-v2.9.7-450d70d \
            --repo "$GITHUB_REPOSITORY" --latest=false
          gh release edit v1.7.2 \
            --repo "$GITHUB_REPOSITORY" --latest=true
          gh release view v1.7.2 --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq .tagName >> "$GITHUB_STEP_SUMMARY"
