name: Slicer worker contract

on:
  pull_request:
    paths:
      - "slicer_worker/**"
      - "compose.yaml"
      - "scripts/install_slicer_staging.py"
      - "scripts/orca_compatibility_patch.py"
      - "scripts/tests/test_install_slicer_staging.py"
      - "scripts/tests/test_orca_compatibility_patch.py"
      - "scripts/probe_slicer_staging.py"
      - "scripts/migrate_generic_slicer_staging.py"
      - "scripts/tests/test_migrate_generic_slicer_staging.py"
      - "scripts/tests/test_probe_slicer_staging.py"
      - ".dockerignore"
      - ".github/workflows/slicer-contract.yml"
  push:
    branches: [main]
    paths:
      - "slicer_worker/**"
      - "compose.yaml"
      - "scripts/install_slicer_staging.py"
      - "scripts/orca_compatibility_patch.py"
      - "scripts/tests/test_install_slicer_staging.py"
      - "scripts/tests/test_orca_compatibility_patch.py"
      - "scripts/probe_slicer_staging.py"
      - "scripts/tests/test_probe_slicer_staging.py"
      - ".github/workflows/slicer-contract.yml"

permissions:
  contents: read

jobs:
  worker-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Worker contract unit tests (no engine binaries)
        run: python3 -m unittest discover -s slicer_worker/tests -p "test_*.py" -v
      - name: Compile worker modules
        run: python3 -m compileall -q slicer_worker
      - name: Verify staging installer release, secret and lifecycle contracts offline
        run: python3 -m unittest discover -s scripts/tests -p "test_install_slicer_staging.py" -v
      - name: Verify generic single-container migration and rollback contract offline
        run: python3 -m unittest scripts.tests.test_migrate_generic_slicer_staging -v
      - name: Verify pinned Orca 2.5 source compatibility patch offline
        run: python3 -m unittest scripts.tests.test_orca_compatibility_patch -v
      - name: Verify real-engine acceptance probe isolation and fail-closed contracts offline
        run: python3 -m unittest discover -s scripts/tests -p "test_probe_slicer_staging.py" -v
      - name: Validate exactly four services on one private Compose network
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          MAKERVAULT_SLICER_WORKER_TOKEN: "0123456789012345678901234567890123456789"
          MAKERVAULT_SLICER_INSTALLER_TOKEN: "9876543210987654321098765432109876543210"
          MAKERVAULT_SLICER_WORKER_IMAGE: "ghcr.io/gavrd7/makervault-slicer:0.1.0"
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-placeholder\n' > .env
          docker compose config --quiet
          docker compose config --format json | python3 -c '
          import json,sys
          stack=json.load(sys.stdin)
          services=stack["services"]
          assert set(services) == {"makervault","postgres","redis","slicer-worker"}, services.keys()
          assert set(stack["networks"]) == {"makervault"}, stack["networks"]
          from pathlib import Path
          compose=Path("compose.yaml").read_text()
          assert compose.index("  makervault:") < compose.index("  postgres:") < compose.index("  redis:") < compose.index("  slicer-worker:")
          assert services["slicer-worker"]["volumes"][0]["source"] == "makervault_slicer_engines"
          assert not any(p.get("target")==8555 for p in services["makervault"].get("ports",[]) if isinstance(p,dict))
          for name in ("makervault","postgres","redis","slicer-worker"):
              assert len(services[name]["networks"]) == 1
          for name in ("postgres","redis","slicer-worker"):
              assert not services[name].get("ports"), name
          for name in ("makervault","slicer-worker"):
              assert "build" not in services[name]
          assert not any("profiles" in value for value in services.values())
          assert set(services["slicer-worker"]["cap_add"]) == {"SETUID","SETGID","KILL"}
          assert services["slicer-worker"]["container_name"] == "makervault-slicer"
          assert services["slicer-worker"]["environment"]["SLICER_INSTALLER_TOKEN"] != services["slicer-worker"]["environment"]["SLICER_WORKER_TOKEN"]
          assert not any(k in services["slicer-worker"] for k in ("cpus","mem_limit"))
          assert "slicer-engine-store-init" not in services
          '


      - name: Validate independent custom slicer storage bind mount
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          MAKERVAULT_SLICER_WORKER_TOKEN: "0123456789012345678901234567890123456789"
          MAKERVAULT_SLICER_INSTALLER_TOKEN: "9876543210987654321098765432109876543210"
          SLICER_ENGINE_STORAGE: /srv/makervault/slicer-engines
          MEDIA_STORAGE: /srv/makervault/media
        run: |
          docker compose config --format json | python3 -c '
          import json,sys
          services=json.load(sys.stdin)["services"]
          slicer=services["slicer-worker"]["volumes"][0]
          media=services["makervault"]["volumes"][0]
          assert slicer["type"] == "bind" and slicer["source"] == "/srv/makervault/slicer-engines"
          assert slicer["target"] == "/opt/engine-store"
          assert media["type"] == "bind" and media["source"] == "/srv/makervault/media"
          '

  candidate-image-build:
    # Legacy worker-only smoke has been replaced: the deployed staging image
    # now runs the worker and installer as separate UIDs in ONE container.
    # Keep verifying the fixture-only stage contract, but never treat that
    # intentionally non-executable asset as an installed slicing engine.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Stage a clearly non-executable CI fixture (never a real engine)
        run: |
          printf 'CI fixture only, not a slicing engine\n' > /tmp/creality-fixture.AppImage
          SHA=$(sha256sum /tmp/creality-fixture.AppImage | cut -d' ' -f1)
          python3 -m slicer_worker.stage_engines \
            --engine crealityprint 7.3.0 /tmp/creality-fixture.AppImage "$SHA"
      - name: Build combined slicer runtime with approved bundled Orca
        run: docker build -f slicer_worker/Dockerfile.generic -t makervault-slicer-ci:combined .
      - name: Verify fresh named volume inherits installer ownership without helper
        run: |
          set -euo pipefail
          docker volume create mv-contract-fresh-engine-store
          trap 'docker volume rm mv-contract-fresh-engine-store >/dev/null 2>&1 || true' EXIT
          docker run --rm --network none \
            -v mv-contract-fresh-engine-store:/opt/engine-store \
            --entrypoint python3 makervault-slicer-ci:combined -c \
            'import os,stat; path="/opt/engine-store"; s=os.stat(path); assert s.st_uid == 10002, s.st_uid; assert not (s.st_mode & 0o022), oct(s.st_mode)'
      - name: Confirm compiled worker/installer modules and reviewed Orca identity
        run: |
          docker run --rm --network none --entrypoint python3 makervault-slicer-ci:combined \
            -c 'from pathlib import Path; import slicer_worker.service,slicer_worker.engine_installer_service,slicer_worker.combined_service; assert Path("/opt/engines/orcaslicer.AppImage").is_file()'
      - name: Boot combined staging runtime with installer credentials and engine-store permissions
        run: |
          set -euo pipefail
          docker volume create mv-contract-engine-store
          docker run --rm --network none \
            -v mv-contract-engine-store:/engine-store busybox:1.37.0 \
            sh -ec 'chown -R 10002:10002 /engine-store; chmod 0755 /engine-store'
          docker run -d --name mv-contract-combined --network none \
            --read-only --init --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL \
            --security-opt no-new-privileges:true \
            --pids-limit 144 --memory 4g \
            --tmpfs /tmp:rw,nosuid,size=1g,mode=1777 \
            -v mv-contract-engine-store:/opt/engine-store:rw \
            -e SLICER_WORKER_TOKEN=0123456789012345678901234567890123456789 \
            -e SLICER_INSTALLER_TOKEN=9876543210987654321098765432109876543210 \
            -e 'SLICER_ENGINES_JSON={}' \
            makervault-slicer-ci:combined
          healthy=0
          for n in {1..60}; do
            if docker exec mv-contract-combined python3 -c \
              'import json,socket,urllib.request; j=json.load(urllib.request.urlopen("http://127.0.0.1:8088/health",timeout=2)); assert j["ready"]; s=socket.create_connection(("127.0.0.1",8091),2); s.close()' \
              >/dev/null 2>&1; then healthy=1; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' mv-contract-combined)" != true ]; then
              docker logs mv-contract-combined || true
              exit 1
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          docker exec -u 10001 mv-contract-combined python3 -c \
            'import os; assert not os.access("/opt/engine-store",os.W_OK)'
          docker exec -u 10002 mv-contract-combined python3 -c \
            'from pathlib import Path; f=Path("/opt/engine-store/.contract-write"); f.write_text("ok"); f.unlink()'
      - name: Remove contract smoke container and volume
        if: always()
        run: |
          docker logs mv-contract-combined 2>/dev/null | tail -60 || true
          docker rm -f mv-contract-combined 2>/dev/null || true
          docker volume rm mv-contract-engine-store 2>/dev/null || true
