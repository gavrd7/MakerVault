name: PrusaSlicer reviewed bundle + isolated worker acceptance

# Expensive, artifact-backed acceptance is explicitly opt-in.
# The pinned 25 Nov source candidate is held for only 7 days; this is not
# a required PR check after the temporary GitHub Actions artifact expires.
on:
  workflow_dispatch:
  push:
    branches: [feature/slicer-prusa-engine]

permissions:
  contents: read
  actions: read

jobs:
  native-install-and-slice:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prusa-package-smoke]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and pin the exact successful real-binary candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prusa"
          gh run download 45509961312 --repo "$GITHUB_REPOSITORY" \
            --name prusa-2.9.7-headless-linux-amd64-candidate \
            --dir "$RUNNER_TEMP/prusa"
          archive="$RUNNER_TEMP/prusa/prusa-2.9.7-headless-linux-amd64.tar.gz"
          echo "963eb81fd972d50c5f8fe54c3adb6dce2eab39c9ab223534b917eae76973d913  $archive" | sha256sum --check

      - name: Build existing combined worker unchanged
        run: docker build -f slicer_worker/Dockerfile.generic -t prusa-integration:smoke .

      - name: Install Prusa alongside Orca through the verified installer path
        shell: bash
        run: |
          set -euo pipefail
          volume="prusa-test-$GITHUB_RUN_ID"
          docker volume create "$volume" >/dev/null
          echo "TEST_VOLUME=$volume" >> "$GITHUB_ENV"
          docker run --rm --network none --user 10002:10002 \
            -v "$volume:/opt/engine-store:rw" \
            -v "$RUNNER_TEMP/prusa/prusa-2.9.7-headless-linux-amd64.tar.gz:/tmp/prusa.tar.gz:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          import json, shutil
          from pathlib import Path
          from unittest.mock import patch
          from slicer_worker import engine_installer_service as installer
          from slicer_worker import prusa_runtime_install as prusa
          from slicer_worker.engine_store_admin import activate, seed_bundled_orca, EXPECTED_ORCA_SHA
          store = Path("/opt/engine-store")
          seed_bundled_orca(store)
          activate(store, engine="orcaslicer", version="2.5.0", sha256=EXPECTED_ORCA_SHA)
          release = {
              "engine": "prusaslicer", "version": prusa.VERSION,
              "bundle_sha256": prusa.ARCHIVE_SHA256,
              "bundle_url": "https://github.com/gavrd7/MakerVault/releases/download/" + prusa.RELEASE_TAG + "/" + prusa.ASSET_NAME,
              "asset_size": prusa.ASSET_SIZE, "binary_sha256": prusa.BINARY_SHA256,
          }
          def copy_approved_source(_release, destination, _progress):
              shutil.copyfile("/tmp/prusa.tar.gz", destination)
          with patch.object(installer, "_download", side_effect=copy_approved_source), \
               patch.object(installer, "_write_operation"):
              installer._install_reviewed_prusa("ci-restricted", release)
          installed = json.loads((store / "active.json").read_text())["engines"]
          assert set(installed) == {"orcaslicer", "prusaslicer"}, installed
          assert installed["prusaslicer"]["binary_sha256"] == prusa.BINARY_SHA256
          assert (store / "versions" / "prusaslicer" / "2.9.7" / "approved-identity.json").is_file()
          print("PASS: installer activated Prusa and preserved Orca.")
          '

      - name: Validate actual read-only worker UID and native positive-E G-code
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -e SLICER_WORKER_TOKEN=0123456789012345678901234567890123456789 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          from slicer_worker.engine_registry import configured_engines
          engines = configured_engines()
          assert set(engines) == {"orcaslicer", "prusaslicer"}, engines
          print("PASS: both isolated worker engine identities have matching SHA-256.")
          '
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/prusa_smoke.py \
            --binary /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            --vendor /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Exercise authenticated real Prusa HTTP worker end-to-end
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -e SLICER_WORKER_TOKEN=0123456789012345678901234567890123456789 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          import base64, hashlib, json, runpy, threading, uuid
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from slicer_worker import service
          from slicer_worker.prusa_vendor_profiles import flatten_prusa_vendor_preset
          from slicer_worker.prusa_gcode_audit import audit_prusa_positive_e
          from slicer_worker.prusa_runtime_install import BINARY_SHA256
          vendor = Path("/opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini").read_bytes()
          vendor_sha = hashlib.sha256(vendor).hexdigest()
          cube = runpy.run_path("/tmp/prusa_smoke.py")["cube_stl"]()
          native = {}
          for kind, name, field in (
              ("printer", "Original Prusa i3 MK2S", "printer_profile"),
              ("filament", "Generic PLA", "filament_profile"),
              ("print", "0.20mm NORMAL", "process_profile")):
              native[field] = base64.b64encode(flatten_prusa_vendor_preset(
                  vendor, kind=kind, name=name,
                  expected_sha256=vendor_sha)).decode("ascii")
          worker = service.BoundedWorkerHTTPServer(("127.0.0.1", 0), service.Handler)
          thread = threading.Thread(target=worker.serve_forever, daemon=True)
          thread.start()
          base = "http://127.0.0.1:" + str(worker.server_address[1])
          try:
              with urlopen(base + "/health", timeout=10) as reply:
                  health = json.load(reply)
              assert health["engines"]["prusaslicer"]["binary_sha256"] == BINARY_SHA256
              assert "orcaslicer" in health["engines"]
              payload = {
                  "job_id": str(uuid.uuid4()),
                  "engine": "prusaslicer", "engine_version": "2.9.7",
                  "model_format": "stl", "model": base64.b64encode(cube).decode(),
                  **native,
              }
              data = json.dumps(payload).encode("utf-8")
              unauthorised = Request(base + "/v1/slice", data=data,
                                     headers={"Content-Type": "application/json"})
              try:
                  urlopen(unauthorised, timeout=10)
                  raise AssertionError("Worker accepted an unauthenticated job")
              except HTTPError as error:
                  assert error.code == 403
              request = Request(base + "/v1/slice", data=data, headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer 0123456789012345678901234567890123456789",
              })
              with urlopen(request, timeout=120) as response:
                  assert response.status == 200
                  result = json.load(response)
              gcode = base64.b64decode(result["gcode"], validate=True)
              assert result["bytes"] == len(gcode)
              assert result["sha256"] == hashlib.sha256(gcode).hexdigest()
              quality = audit_prusa_positive_e(gcode)
              assert quality["positive_e_moves"] >= 20, quality
              print("PASS: real authenticated native Prusa HTTP STL slice, "
                    + str(quality["positive_e_moves"]) + " positive-E moves.")
          finally:
              worker.shutdown()
              worker.server_close()
          '

      - name: Verify real native Prusa CLI preserves two placed STL cubes
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_placed_native_smoke.py:/tmp/prusa_placed.py:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/prusa_placed.py \
            --binary /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            --vendor /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Uninstall and reinstall Prusa without affecting Orca
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10002:10002 \
            -v "$TEST_VOLUME:/opt/engine-store:rw" \
            -v "$RUNNER_TEMP/prusa/prusa-2.9.7-headless-linux-amd64.tar.gz:/tmp/prusa.tar.gz:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          import json, shutil
          from pathlib import Path
          from unittest.mock import patch
          from slicer_worker import engine_installer_service as installer
          from slicer_worker import prusa_runtime_install as prusa
          from slicer_worker.engine_store_lifecycle import uninstall_engine, installed_versions
          store = Path("/opt/engine-store")
          uninstall_engine(store, "prusaslicer")
          current = json.loads((store / "active.json").read_text())["engines"]
          assert set(current) == {"orcaslicer"}, current
          assert not (store / "versions" / "prusaslicer").exists()
          release = {
              "engine": "prusaslicer", "version": prusa.VERSION,
              "bundle_sha256": prusa.ARCHIVE_SHA256,
              "bundle_url": "https://github.com/gavrd7/MakerVault/releases/download/" + prusa.RELEASE_TAG + "/" + prusa.ASSET_NAME,
              "asset_size": prusa.ASSET_SIZE, "binary_sha256": prusa.BINARY_SHA256,
          }
          with patch.object(installer, "_download", side_effect=lambda _r, dest, _p: shutil.copyfile("/tmp/prusa.tar.gz", dest)), \
               patch.object(installer, "_write_operation"):
              installer._install_reviewed_prusa("ci-reinstall", release)
          current = json.loads((store / "active.json").read_text())["engines"]
          assert set(current) == {"orcaslicer", "prusaslicer"}, current
          assert current["prusaslicer"]["binary_sha256"] == prusa.BINARY_SHA256
          assert installed_versions(store)["prusaslicer"][0]["active"]
          print("PASS: Prusa uninstall/reinstall preserves Orca and active identities.")
          '

      - name: Cleanup isolated test volume
        if: always()
        run: |
          if [ -n "${TEST_VOLUME:-}" ]; then
            docker volume rm "$TEST_VOLUME" >/dev/null || true
          fi
