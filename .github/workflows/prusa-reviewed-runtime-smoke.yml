          import os
          from pathlib import Path
          from core.slicer_prusa_3mf import build_prusa_native_3mf
          from scripts.prusa_real_binary_smoke import cube_stl
          def item(x, density):
              return {"asset_id": "verified-cube", "x_mm": x, "y_mm": 0,
                      "z_mm": 0, "rotation_deg": 0, "scale_percent": 100,
                      "process_overrides": {"sparse_infill_density": density}}
          Path(os.environ["PROJECT"]).write_bytes(build_prusa_native_3mf([
              (item(-35, 15), cube_stl()), (item(35, 60), cube_stl()),
          ], bed_width=250, bed_depth=210))
          PY

      - name: Qualify native Prusa 3MF object settings with genuine CLI
