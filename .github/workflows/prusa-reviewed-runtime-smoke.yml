name: PrusaSlicer reviewed bundle + isolated worker acceptance

# Expensive genuine native acceptance is opt-in, using the exact
# independently verified permanent public Prusa 2.9.7 runtime archive.
# Its content SHA is pinned independently of release metadata.
on:
  workflow_dispatch:
  push:
    branches: [feature/slicer-prusa-engine, feature/prusa-makervault-parity]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  native-install-and-slice:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'feature/slicer-prusa-engine' || github.head_ref == 'feature/prusa-makervault-parity')) || contains(github.event.head_commit.message, '[prusa-package-smoke]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and hash-pin the permanent reviewed Prusa 2.9.7 runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prusa"
          gh release download prusa-runtime-v2.9.7-450d70d \
            --repo "$GITHUB_REPOSITORY" \
            --pattern prusa-2.9.7-headless-linux-amd64.tar.gz \
            --dir "$RUNNER_TEMP/prusa"
          archive="$RUNNER_TEMP/prusa/prusa-2.9.7-headless-linux-amd64.tar.gz"
          echo "963eb81fd972d50c5f8fe54c3adb6dce2eab39c9ab223534b917eae76973d913  $archive" | sha256sum --check

      - name: Build existing combined worker unchanged
        run: docker build -f slicer_worker/Dockerfile.generic -t prusa-integration:smoke .

      - name: Install Prusa alongside Orca through the verified installer path
        shell: bash
        run: |
          set -euo pipefail
          volume="prusa-test-$GITHUB_RUN_ID"
          docker volume create "$volume" >/dev/null
          echo "TEST_VOLUME=$volume" >> "$GITHUB_ENV"
          docker run --rm --network none --user 10002:10002 \
            -v "$volume:/opt/engine-store:rw" \
            -v "$RUNNER_TEMP/prusa/prusa-2.9.7-headless-linux-amd64.tar.gz:/tmp/prusa.tar.gz:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          import json, shutil
          from pathlib import Path
          from unittest.mock import patch
          from slicer_worker import engine_installer_service as installer
          from slicer_worker import prusa_runtime_install as prusa
          from slicer_worker.engine_store_admin import activate, seed_bundled_orca, EXPECTED_ORCA_SHA
          store = Path("/opt/engine-store")
          seed_bundled_orca(store)
          activate(store, engine="orcaslicer", version="2.5.0", sha256=EXPECTED_ORCA_SHA)
          release = {
              "engine": "prusaslicer", "version": prusa.VERSION,
              "bundle_sha256": prusa.ARCHIVE_SHA256,
              "bundle_url": "https://github.com/gavrd7/MakerVault/releases/download/" + prusa.RELEASE_TAG + "/" + prusa.ASSET_NAME,
              "asset_size": prusa.ASSET_SIZE, "binary_sha256": prusa.BINARY_SHA256,
          }
          def copy_approved_source(_release, destination, _progress):
              shutil.copyfile("/tmp/prusa.tar.gz", destination)
          with patch.object(installer, "_download", side_effect=copy_approved_source), \
               patch.object(installer, "_write_operation"):
              installer._install_reviewed_prusa("ci-restricted", release)
          installed = json.loads((store / "active.json").read_text())["engines"]
          assert set(installed) == {"orcaslicer", "prusaslicer"}, installed
          assert installed["prusaslicer"]["binary_sha256"] == prusa.BINARY_SHA256
          assert (store / "versions" / "prusaslicer" / "2.9.7" / "approved-identity.json").is_file()
          print("PASS: installer activated Prusa and preserved Orca.")
          '

      - name: Validate actual read-only worker UID and native positive-E G-code
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -e SLICER_WORKER_TOKEN=0123456789012345678901234567890123456789 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          from slicer_worker.engine_registry import configured_engines
          engines = configured_engines()
          assert set(engines) == {"orcaslicer", "prusaslicer"}, engines
          print("PASS: both isolated worker engine identities have matching SHA-256.")
          '
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/prusa_smoke.py \
            --binary /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            --vendor /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Exercise authenticated real Prusa HTTP worker end-to-end
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -e SLICER_WORKER_TOKEN=0123456789012345678901234567890123456789 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          import base64, hashlib, json, runpy, threading, uuid
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from slicer_worker import service
          from slicer_worker.prusa_vendor_profiles import flatten_prusa_vendor_preset
          from slicer_worker.prusa_gcode_audit import audit_prusa_positive_e
          from slicer_worker.prusa_runtime_install import BINARY_SHA256
          vendor = Path("/opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini").read_bytes()
          vendor_sha = hashlib.sha256(vendor).hexdigest()
          cube = runpy.run_path("/tmp/prusa_smoke.py")["cube_stl"]()
          native = {}
          for kind, name, field in (
              ("printer", "Original Prusa i3 MK2S", "printer_profile"),
              ("filament", "Generic PLA", "filament_profile"),
              ("print", "0.20mm NORMAL", "process_profile")):
              native[field] = base64.b64encode(flatten_prusa_vendor_preset(
                  vendor, kind=kind, name=name,
                  expected_sha256=vendor_sha)).decode("ascii")
          worker = service.BoundedWorkerHTTPServer(("127.0.0.1", 0), service.Handler)
          thread = threading.Thread(target=worker.serve_forever, daemon=True)
          thread.start()
          base = "http://127.0.0.1:" + str(worker.server_address[1])
          try:
              with urlopen(base + "/health", timeout=10) as reply:
                  health = json.load(reply)
              assert health["engines"]["prusaslicer"]["binary_sha256"] == BINARY_SHA256
              assert "orcaslicer" in health["engines"]
              payload = {
                  "job_id": str(uuid.uuid4()),
                  "engine": "prusaslicer", "engine_version": "2.9.7",
                  "model_format": "stl", "model": base64.b64encode(cube).decode(),
                  **native,
              }
              data = json.dumps(payload).encode("utf-8")
              unauthorised = Request(base + "/v1/slice", data=data,
                                     headers={"Content-Type": "application/json"})
              try:
                  urlopen(unauthorised, timeout=10)
                  raise AssertionError("Worker accepted an unauthenticated job")
              except HTTPError as error:
                  assert error.code == 403
              request = Request(base + "/v1/slice", data=data, headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer 0123456789012345678901234567890123456789",
              })
              with urlopen(request, timeout=120) as response:
                  assert response.status == 200
                  result = json.load(response)
              gcode = base64.b64decode(result["gcode"], validate=True)
              assert result["bytes"] == len(gcode)
              assert result["sha256"] == hashlib.sha256(gcode).hexdigest()
              quality = audit_prusa_positive_e(gcode)
              assert quality["positive_e_moves"] >= 20, quality
              print("PASS: real authenticated native Prusa HTTP STL slice, "
                    + str(quality["positive_e_moves"]) + " positive-E moves.")
          finally:
              worker.shutdown()
              worker.server_close()
          '

      - name: Bake actual MakerVault model transforms for native CLI acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/prusa-backend-venv"
          "$RUNNER_TEMP/prusa-backend-venv/bin/pip" install --quiet defusedxml==0.7.1
          export PRUSA_PLATE_PATH="$RUNNER_TEMP/makervault-prusa-placed.stl"
          echo "PRUSA_PLATE_PATH=$PRUSA_PLATE_PATH" >> "$GITHUB_ENV"
          PYTHONPATH=backend "$RUNNER_TEMP/prusa-backend-venv/bin/python" - <<'PY'
          import os, struct
          from pathlib import Path
          from core.slicer_prusa_plate import build_prusa_placed_stl
          from scripts.prusa_real_binary_smoke import cube_stl
          source = cube_stl()
          def item(x, rotate):
              return {"asset_id": "verified-cube",
                      "x_mm": x, "y_mm": 0, "z_mm": 0,
                      "rotation_deg": rotate, "rotation_xyz_deg": [0,0],
                      "scale_percent": 100,
                      "scale_xyz_percent": [100,100,100]}
          baked = build_prusa_placed_stl([
              (item(-35, 0), source), (item(35, 90), source),
          ], bed_width=250, bed_depth=210)
          assert struct.unpack_from("<I", baked, 80)[0] == 24
          Path(os.environ["PRUSA_PLATE_PATH"]).write_bytes(baked)
          print("PASS: real backend preview transforms baked into 24-triangle STL.")
          PY

      - name: Verify real native Prusa CLI preserves two placed STL cubes
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_placed_native_smoke.py:/tmp/prusa_placed.py:ro" \
            -v "$PRUSA_PLATE_PATH:/tmp/makervault-prusa-placed.stl:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/prusa_placed.py \
            --binary /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            --vendor /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini \
            --input-stl /tmp/makervault-prusa-placed.stl

      - name: Qualify numeric process overrides with actual native G-code
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_real_binary_smoke.py:/tmp/prusa_smoke.py:ro" \
            -v "$GITHUB_WORKSPACE/slicer_worker/tests/test_prusa_process_overrides.py:/tmp/prusa_overrides_test.py:ro" \
            -v "$GITHUB_WORKSPACE/slicer_worker/prusa_process_overrides.py:/tmp/prusa_process_overrides.py:ro" \
            --entrypoint python3 prusa-integration:smoke -c '
          import runpy, sys, types
          module = types.ModuleType("slicer_worker.prusa_process_overrides")
          module.__dict__.update(runpy.run_path("/tmp/prusa_process_overrides.py"))
          sys.modules["slicer_worker.prusa_process_overrides"] = module
          runpy.run_path("/tmp/prusa_overrides_test.py")["native_smoke"](
              "/opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer",
              "/opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini",
              runpy.run_path("/tmp/prusa_smoke.py")["cube_stl"]())
          '

      - name: Inspect exact upstream Prusa MMU and XL printer topology
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_mmu_profile_inventory.py:/tmp/prusa_mmu_inventory.py:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/prusa_mmu_inventory.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Prepare synthetic Prusa MMU candidate projects
        run: |
          set -euo pipefail
          echo "PRUSA_MMU_DIR=$RUNNER_TEMP/prusa-mmu" >> "$GITHUB_ENV"
          PYTHONPATH=backend:. "$RUNNER_TEMP/prusa-backend-venv/bin/python" scripts/prusa_generate_mmu_dialect_candidates.py "$RUNNER_TEMP/prusa-mmu"

      - name: Qualify native MMU3 research tool assignments
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_mmu_dialect_smoke.py:/tmp/mmu.py:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -e PYTHONPATH=/tmp/mv-backend:/opt/makervault-slicer \
            -v "$PRUSA_MMU_DIR:/tmp/mmu:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/mmu.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini \
            /tmp/mmu

      - name: Qualify authenticated offline MMU worker execution on genuine Prusa 2.9.7
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_offline_mmu_worker_smoke.py:/tmp/offline_mmu.py:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -e PYTHONPATH=/tmp/mv-backend:/opt/makervault-slicer \
            -v "$PRUSA_MMU_DIR:/tmp/mmu:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/offline_mmu.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini \
            /tmp/mmu

      - name: Research five-slot native MMU worker deposition
        id: prusa_five_tool_research
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_five_tool_worker_smoke.py:/tmp/five_mmu.py:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_multitool_object_settings_audit.py:/tmp/prusa_object_wall.py:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -e PYTHONPATH=/tmp/mv-backend:/opt/makervault-slicer \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/five_mmu.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Qualify native Prusa XL independent-head offline worker
        id: prusa_xl_offline_research
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_offline_xl_worker_smoke.py:/tmp/offline_xl.py:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -e PYTHONPATH=/tmp/mv-backend:/opt/makervault-slicer \
            -v "$PRUSA_MMU_DIR:/tmp/mmu:ro" \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/offline_xl.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini \
            /tmp/mmu

      - name: Qualify five independent XL toolheads on genuine Prusa 2.9.7
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_five_head_xl_smoke.py:/tmp/five_xl.py:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_multitool_object_settings_audit.py:/tmp/prusa_object_wall.py:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -e PYTHONPATH=/tmp/mv-backend:/opt/makervault-slicer \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/five_xl.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Require genuine XL5 one- and two-wall native painted deposition
        id: prusa_xl_paint_research
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_xl_colour_research.py:/tmp/xl_paint.py:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/tmp/scripts:ro" \
            -e PYTHONPATH=/tmp:/tmp/mv-backend:/opt/makervault-slicer \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/xl_paint.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Require native XL5 independent-head split-wall deposition
        id: prusa_xl_partial_surface_research
        # Required now that the authenticated XL adapter permits independently
        # qualified single-tool split masks; MMU remains separately audited.
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/tmp/scripts:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_xl_partial_wall_smoke.py:/tmp/xl_partial.py:ro" \
            -e PYTHONPATH=/tmp:/tmp/mv-backend:/opt/makervault-slicer \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/xl_partial.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Report unresolved Prusa XL split-wall painting qualification
        if: ${{ steps.prusa_xl_partial_surface_research.outcome == 'failure' }}
        run: |
          echo "::warning title=Prusa XL split-wall paint::Native XL partial-surface deposition remains unqualified; retain complete-wall admission."

      - name: Require Prusa XL5 horizontal split top-surface colour deposition
        id: prusa_horizontal_surface_research
        # Mandatory pinned genuine output: normal XL5 offline submission now
        # admits signed partial top masks and audits real top-skin extrusion.
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/tmp/scripts:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_horizontal_colour_research.py:/tmp/horizontal_paint.py:ro" \
            -e PYTHONPATH=/tmp:/tmp/mv-backend:/opt/makervault-slicer \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/horizontal_paint.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Report unresolved Prusa horizontal split colour qualification
        if: ${{ steps.prusa_horizontal_surface_research.outcome == 'failure' }}
        run: |
          echo "::warning title=Prusa horizontal paint::Nonvertical partial colour deposition has no native qualification; do not widen the signed wall audit."

      - name: Require genuine XL5 tilted partial-surface native painting
        id: prusa_slanted_partial_research
        # Mandatory since authenticated XL5 offline jobs now accept signed
        # slanted planar T1 masks with independent 3-D source/deposition audit.
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/tmp/scripts:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_slanted_colour_research.py:/tmp/slanted_paint.py:ro" \
            -e PYTHONPATH=/tmp:/tmp/mv-backend:/opt/makervault-slicer \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/slanted_paint.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini

      - name: Report unqualified Prusa tilted paint deposition
        if: ${{ steps.prusa_slanted_partial_research.outcome == 'failure' }}
        run: |
          echo "::warning title=Sloped Prusa colour::Native slanted surface source/deposition still unqualified; do not bypass workbench admission."

      - name: Fetch and inspect Prusa's official INDX 2.5.16 profile bundle
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/prusa3d/PrusaSlicer-settings-prusa-fff/058c542282d5a512dcc73fc8be9288fc253ddcfd/PrusaResearch/2.5.16.ini"
          curl --fail --location --silent --show-error --retry 2 --max-time 90 "$url" \
            -o "$RUNNER_TEMP/prusa-indx-official.ini"
          test "$(git hash-object "$RUNNER_TEMP/prusa-indx-official.ini")" = \
            "1aad47dce4b3967c73b38bc996e1ac947c8a23d4"
          echo "PRUSA_INDX_VENDOR=$RUNNER_TEMP/prusa-indx-official.ini" >> "$GITHUB_ENV"
          grep -Ei '^\[printer:.*INDX.*\]' "$RUNNER_TEMP/prusa-indx-official.ini" | head -30

      - name: Require eight-tool independent Prusa native T0–T7 attribution
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
            -v "$GITHUB_WORKSPACE/scripts/prusa_native_indx_eight_tool_smoke.py:/tmp/indx_eight.py:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/tmp/scripts:ro" \
            -v "$GITHUB_WORKSPACE/backend:/tmp/mv-backend:ro" \
            -v "$PRUSA_INDX_VENDOR:/tmp/official-indx.ini:ro" \
            -e PYTHONPATH=/tmp:/tmp/mv-backend:/opt/makervault-slicer \
            --entrypoint python3 prusa-integration:smoke \
            /tmp/indx_eight.py \
            /opt/engine-store/versions/prusaslicer/2.9.7/bin/prusa-slicer \
            /opt/engine-store/versions/prusaslicer/2.9.7/resources/profiles/PrusaResearch.ini \
            /tmp/official-indx.ini

      - name: Research actual distinct MMU heater commands
        id: prusa_native_temperature_research
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 \
            -v "$TEST_VOLUME:/opt/engine-store:ro" \
