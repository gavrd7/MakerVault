name: Publish MakerVault container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (e.g. v1.0.4), or main to publish dev only"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: makervault-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ "${VERSION}" == "main" ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag against application version
        if: ${{ steps.version.outputs.is_dev != 'true' }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ACTUAL_VERSION=$(sed -nE 's/^VERSION = "([^"]+)"/\1/p' backend/makervault/version.py)
          if [[ -z "$ACTUAL_VERSION" || "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Release tag is $EXPECTED_VERSION but backend/makervault/version.py declares $ACTUAL_VERSION"
            exit 1
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gavrd7/makervault
          tags: |
            type=raw,value=dev,enable=${{ steps.version.outputs.is_dev == 'true' }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_dev != 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_dev != 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_dev != 'true' && !contains(steps.version.outputs.version, '-') }}

      # A versioned release publishes the combined slicer FIRST. If its build,
      # isolation checks or GHCR push fail, the MakerVault image is not released.
      - name: Verify combined slicer worker and installer contracts
        if: ${{ steps.version.outputs.is_dev != 'true' }}
        run: |
          python3 -m unittest slicer_worker.tests.test_combined_service slicer_worker.tests.test_engine_installer_service -v
          python3 -m compileall -q slicer_worker

      - name: Build and validate combined slicer release candidate
        if: ${{ steps.version.outputs.is_dev != 'true' }}
        run: |
          docker build -f slicer_worker/Dockerfile.generic -t makervault-slicer:release-validation .
          docker run --rm --network none --entrypoint python3 makervault-slicer:release-validation \
            -c 'import slicer_worker.combined_service,slicer_worker.engine_installer_service,slicer_worker.service'

      - name: Publish version-matched combined slicer image
        if: ${{ steps.version.outputs.is_dev != 'true' }}
        id: slicer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: slicer_worker/Dockerfile.generic
          platforms: linux/amd64
          push: true
          tags: ghcr.io/gavrd7/makervault-slicer:${{ steps.version.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=combined-slicer
          cache-to: type=gha,mode=max,scope=combined-slicer

      - name: Validate published slicer digest before application build
        if: ${{ steps.version.outputs.is_dev != 'true' }}
        env:
          SLICER_DIGEST: ${{ steps.slicer.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$SLICER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Combined slicer image: ghcr.io/gavrd7/makervault-slicer@$SLICER_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            MAKERVAULT_SLICER_WORKER_IMAGE=${{ steps.version.outputs.is_dev != 'true' && format('ghcr.io/gavrd7/makervault-slicer@{0}', steps.slicer.outputs.digest) || '' }}
            MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST=${{ steps.slicer.outputs.digest }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify released application embeds the matching slicer digest
        if: ${{ steps.version.outputs.is_dev != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SLICER_DIGEST: ${{ steps.slicer.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "ghcr.io/gavrd7/makervault:$RELEASE_VERSION"
          docker run --rm --network none -e EXPECTED_SLICER_DIGEST="$SLICER_DIGEST" --entrypoint python "ghcr.io/gavrd7/makervault:$RELEASE_VERSION" -c '
          import os,sys
          expected=os.environ.get("EXPECTED_SLICER_DIGEST")
          assert expected and expected.startswith("sha256:")
          assert os.getenv("MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST")==expected
          assert os.getenv("MAKERVAULT_SLICER_WORKER_IMAGE")=="ghcr.io/gavrd7/makervault-slicer@"+expected
          '
          echo "Validated application and slicer GHCR image identity: $SLICER_DIGEST" >> "$GITHUB_STEP_SUMMARY"
