name: Publish v1.7 combined MakerVault Slicer image

# Deliberate manual release step: not triggered by merges or pull requests.
# Publishing is a separate decision after review of the release candidate.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH-SLICER-1.7.0 to approve publishing"
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH-SLICER-1.7.0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Run combined worker/installer contract tests
        run: python3 -m unittest slicer_worker.tests.test_combined_service slicer_worker.tests.test_engine_installer_service -v
      - name: Build reviewed combined image
        run: docker build -f slicer_worker/Dockerfile.generic -t makervault-slicer-combined:release .
      - name: Check the actual combined entry point is installed
        run: |
          docker run --rm --network none --entrypoint python3 makervault-slicer-combined:release -c \
            'import slicer_worker.combined_service, slicer_worker.engine_installer_service, slicer_worker.service'
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined worker image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: slicer_worker/Dockerfile.generic
          platforms: linux/amd64
          push: true
          tags: ghcr.io/gavrd7/makervault-slicer:1.7.0
          provenance: true
          sbom: true
      - name: Record immutable image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "### MakerVault Slicer v1.7.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Combined image: ghcr.io/gavrd7/makervault-slicer@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Record this digest in the v1.7 release acceptance checklist." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing does not update running MakerVault installations." >> "$GITHUB_STEP_SUMMARY"
