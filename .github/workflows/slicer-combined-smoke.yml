name: Combined slicer container isolation smoke

on:
  pull_request:
    paths:
      - "slicer_worker/**"
      - "compose.yaml"
      - ".github/workflows/slicer-combined-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build verified, immutable-source combined slicer image
        run: docker build --file slicer_worker/Dockerfile.generic --tag makervault-slicer-combined:ci .
      - name: Migrate locked legacy engine directories with restricted helper caps
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mv-ci-migration-volume
          docker run --rm --network none \
            -v mv-ci-migration-volume:/engine-store busybox:1.37.0 sh -ec \
            'mkdir -p /engine-store/versions/orcaslicer/2.5.0 /engine-store/versions/crealityprint/7.3.1; echo original > /engine-store/versions/orcaslicer/2.5.0/identity; echo original > /engine-store/versions/crealityprint/7.3.1/identity; chown -R 10001:10001 /engine-store; chmod 0700 /engine-store/versions/orcaslicer/2.5.0 /engine-store/versions/crealityprint/7.3.1'
          docker run --rm --network none --cap-drop ALL \
            --cap-add CHOWN --cap-add FOWNER --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges:true \
            -v mv-ci-migration-volume:/engine-store busybox:1.37.0 sh -ec \
            'chown -R 10002:10002 /engine-store; find /engine-store -type d -exec chmod 0755 {} +; find /engine-store -type f -exec chmod go-w,a+r {} +'
          docker run --rm --network none \
            -v mv-ci-migration-volume:/engine-store:ro busybox:1.37.0 sh -ec \
            'test "$(stat -c %u /engine-store/versions/orcaslicer/2.5.0)" = 10002; test "$(stat -c %u /engine-store/versions/crealityprint/7.3.1)" = 10002; grep -qx original /engine-store/versions/orcaslicer/2.5.0/identity; grep -qx original /engine-store/versions/crealityprint/7.3.1/identity'
      - name: Start both isolated child services in one container
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mv-ci-engine-store
          docker run --rm --network none -v mv-ci-engine-store:/engine-store busybox:1.37.0 sh -ec \
            'chown -R 10002:10002 /engine-store; chmod 0755 /engine-store'
          docker run -d --name mv-ci-combined --network none \
            --read-only --init --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add KILL \
            --security-opt no-new-privileges:true \
            --pids-limit 144 --memory 4g \
            --tmpfs /tmp:rw,nosuid,size=1g,mode=1777 \
            -v mv-ci-engine-store:/opt/engine-store:rw \
            -e SLICER_WORKER_TOKEN=0123456789012345678901234567890123456789 \
            -e SLICER_INSTALLER_TOKEN=9876543210987654321098765432109876543210 \
            -e 'SLICER_ENGINES_JSON={}' \
            makervault-slicer-combined:ci
          for n in {1..80}; do
            if docker exec mv-ci-combined python3 -c \
              'import json,socket,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:8088/health",timeout=2)); assert d["ready"]; s=socket.create_connection(("127.0.0.1",8091),2); s.close()' \
              >/dev/null 2>&1; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' mv-ci-combined)" != true ]; then
              docker logs mv-ci-combined || true
              exit 1
            fi
            sleep 2
          done
          docker exec mv-ci-combined python3 -c \
            'import json,urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8088/health"))["ready"]'
          docker exec -u 10001 mv-ci-combined python3 -c \
            'from pathlib import Path; p=Path("/opt/engine-store/.worker-write-check"); assert not p.exists(); import os; assert not os.access(p.parent,os.W_OK)'
          docker exec -u 10002 mv-ci-combined python3 -c \
            'from pathlib import Path; p=Path("/opt/engine-store/.installer-write-check"); p.write_text("ok"); p.unlink()'
          docker inspect --format '{{.State.Status}}' mv-ci-combined | grep -qx running
      - name: Cleanup temporary CI container and isolated volume
        if: always()
        run: |
          docker logs mv-ci-combined 2>/dev/null | tail -60 || true
          docker rm -f mv-ci-combined 2>/dev/null || true
          docker volume rm mv-ci-engine-store 2>/dev/null || true
          docker volume rm mv-ci-migration-volume 2>/dev/null || true
