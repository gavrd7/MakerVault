name: MakerVault CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Where should this CI run execute?
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted

permissions:
  contents: read

concurrency:
  group: makervault-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && 'ubuntu-latest' || 'makervault-ci' }}
    timeout-minutes: 30
    container: python:3.13-bookworm
    env:
      MAKERVAULT_STORAGE_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: makervault
          POSTGRES_USER: makervault
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U makervault -d makervault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r backend -x backend/core/migrations -ll
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Check Django model migrations
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-for-makervault-tests-0123456789
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Django deployment security checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-for-makervault-tests-0123456789
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_COOKIES: "true"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
        run: python backend/manage.py check --deploy
      - name: Django and importer tests
        env:
          PYTHONPATH: backend
          DJANGO_SECRET_KEY: ci-only-secret-key-for-makervault-tests-0123456789
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
        run: python backend/manage.py test core.tests -v 2

  frontend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && 'ubuntu-latest' || 'makervault-ci' }}
    timeout-minutes: 20
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && 'ubuntu-latest' || 'makervault-ci' }}
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - name: Restore self-hosted workspace ownership
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner == 'self-hosted' }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            python:3.13-bookworm \
            chown -R 1001:1001 /workspace
      - uses: actions/checkout@v4
      - name: Build MakerVault image
        run: docker build --pull -t makervault-ci .
      - name: Verify secured Python runtime versions in image
        run: |
          docker run --rm --entrypoint python makervault-ci -c \
            "import importlib.metadata as m; print('msgpack', m.version('msgpack')); print('setuptools', m.version('setuptools')); assert tuple(map(int, m.version('msgpack').split('.'))) >= (1,2,1); assert tuple(map(int, m.version('setuptools').split('.'))) >= (78,1,1)"
      - name: Scan container OS packages for high/critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --scanners vuln \
            --pkg-types os \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            makervault-ci
