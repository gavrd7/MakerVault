name: MakerVault CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Check Django model migrations
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          POSTGRES_PASSWORD: ci-only-password
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Importer unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/core/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build MakerVault image
        run: docker build -t makervault-ci .
