name: MakerVault user guide

on:
  pull_request:
    paths:
      - 'docs/guide/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - 'scripts/check_guide_links.py'
      - '.github/workflows/guide.yml'
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - 'scripts/check_guide_links.py'
      - '.github/workflows/guide.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m mkdocs build --strict
      - run: python scripts/check_guide_links.py
      - name: Upload reviewable static site
        uses: actions/upload-artifact@v4
        with:
          name: makervault-user-guide
          path: site/
      - name: Package Pages site
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
