name: Feature request
description: Suggest an improvement or new capability for MakerVault.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Please describe the problem or workflow first. A clear use case is more useful than an implementation-only request.

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do that MakerVault does not handle well today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inventory / catalogue
        - Projects / BOM
        - Files / storage
        - Search / navigation
        - Interactive Wiring
        - Maker Tags
        - 3D Printing
        - Printer integration
        - Cameras
        - Filament / spools
        - Models / viewer
        - Accounts / authentication
        - Backup / restore
        - HTTPS / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are you currently solving this another way?

  - type: textarea
    id: hardware
    attributes:
      label: Hardware or external service details
      description: If relevant, include exact models/services and links to public API/protocol documentation.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mock-ups, screenshots or examples are welcome. Remove personal or sensitive information first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for a similar request.
          required: true
        - label: I have described the problem or workflow, not only an implementation idea.
          required: true
