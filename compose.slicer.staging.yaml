# Explicit staging-only engine enablement. Not included in standard Compose.
# An installer writes .slicer-staging.env with the immutable local image ID,
# SHA256 of each verified engine, a strong token and the execution flag.
# Install only via the explicit installer, never automatically with app updates.
services:
  makervault:
    environment:
      MAKERVAULT_SLICER_PREVIEW_ENABLED: "1"
      MAKERVAULT_SLICER_BAMBU_BETA_ENABLED: ${MAKERVAULT_SLICER_BAMBU_BETA_ENABLED:-0}
      MAKERVAULT_SLICER_HOST_UPDATER_ENABLED: ${MAKERVAULT_SLICER_HOST_UPDATER_ENABLED:-0}
      MAKERVAULT_SLICER_INSTALLER_URL: http://slicer-worker:8091
      MAKERVAULT_SLICER_INSTALLER_TOKEN: ${MAKERVAULT_SLICER_INSTALLER_TOKEN:-disabled}
      MAKERVAULT_SLICER_EXECUTION_ENABLED: ${MAKERVAULT_SLICER_EXECUTION_ENABLED:-0}
      MAKERVAULT_SLICER_WORKER_URL: http://slicer-worker:8088
      MAKERVAULT_SLICER_WORKER_TOKEN: ${MAKERVAULT_SLICER_WORKER_TOKEN:?Slicer worker token is required}
      MAKERVAULT_SLICER_WORKER_IMAGE: ${MAKERVAULT_SLICER_WORKER_IMAGE:?Pinned worker image ID required}
      MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST: ${MAKERVAULT_SLICER_ENGINE_IMAGE_DIGEST:?Pinned image digest required}
      MAKERVAULT_SLICER_ENGINES_JSON: ${MAKERVAULT_SLICER_ENGINES_JSON:?Explicit approved binary hashes required}
    networks:
      - makervault_backend
      - makervault_slicer

  slicer-engine-store-init:
    image: busybox:1.37.0
    command: ["sh", "-ec", "chown -R 10002:10002 /engine-store; find /engine-store -type d -exec chmod 0755 {} +; find /engine-store -type f -exec chmod go-w,a+r {} +"]
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    # Existing per-engine directories can be 0700 owned by UID 10001.
    # DAC_READ_SEARCH permits traversal without broad DAC_OVERRIDE/write.
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    network_mode: "none"
    volumes:
      - makervault_slicer_engines:/engine-store:rw

  slicer-worker:
    # Stable Docker container name; retain service DNS name slicer-worker.
    container_name: makervault-slicer
    # The single slicer container runs one non-writable, egress-blocked
    # worker UID 10001 and one installer UID 10002 as distinct processes.
    image: makervault-slicer-combined:staging
    build:
      context: .
      dockerfile: slicer_worker/Dockerfile.generic
    command: ["python3", "-m", "slicer_worker.combined_service"]
    restart: unless-stopped
    depends_on:
      slicer-engine-store-init:
        condition: service_completed_successfully
    user: "0:0"
    init: true
    read_only: true
    cap_drop: [ALL]
    # PID 1 must signal child processes under separate UIDs on shutdown.
    cap_add: [SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 144
    mem_limit: 4g
    cpus: 3
    tmpfs:
      - /tmp:rw,nosuid,size=1g,mode=1777
    volumes:
      - makervault_slicer_engines:/opt/engine-store:rw
      - ./slicer-engine-assets:/opt/staging-orca:ro
    environment:
      SLICER_WORKER_ENABLED: "1"
      SLICER_BAMBU_BETA_ENABLED: ${MAKERVAULT_SLICER_BAMBU_BETA_ENABLED:-0}
      SLICER_WORKER_TOKEN: ${MAKERVAULT_SLICER_WORKER_TOKEN:?Worker token required}
      SLICER_ENGINES_JSON: ${SLICER_ENGINES_JSON:?Verified engine registry required}
      SLICER_INSTALLER_TOKEN: ${MAKERVAULT_SLICER_INSTALLER_TOKEN:-disabled}
    networks:
      - makervault_slicer
      - makervault_installer_egress
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,socket,json,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=2)); s=socket.create_connection(('127.0.0.1',8091),timeout=2); s.close(); sys.exit(0 if d.get('ready') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Docker socket, application database, printer and media remain isolated.
    # Worker cannot write the engine volume (different UID) or connect out
    # (seccomp filter inherited by slicer binaries).

networks:
  makervault_slicer:
    internal: true
  makervault_installer_egress:
    driver: bridge

volumes:
  makervault_slicer_engines:
